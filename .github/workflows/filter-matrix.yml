name: BingX signal-level filter matrix research

on:
  workflow_dispatch:

concurrency:
  group: bingx-filter-matrix-research
  cancel-in-progress: false

jobs:
  filter-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run repository tests
        run: npm test
      - name: Syntax-check research runner
        run: node --check scripts/run-bingx-filter-matrix-backtest.js
      - name: Run 10 signal-level filter variants on fixed 20-pair sample
        env:
          FEE_RATE: "0.0005"
          SLIPPAGE_RATE: "0.0002"
        run: node scripts/run-bingx-filter-matrix-backtest.js
      - name: Upload filter matrix report
        uses: actions/upload-artifact@v4
        with:
          name: bingx-filter-matrix-fixed-20-pairs-30d
          path: bingx-strategy-matrix-20-pairs-30d-report.json
          if-no-files-found: error
          retention-days: 30
