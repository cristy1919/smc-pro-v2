name: BingX VST read-only backtest
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to test
        required: true
        type: choice
        options: [scalp, swing]
      symbol:
        description: BingX USDT-M symbol
        required: true
        default: BTC-USDT
        type: string
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate read-only VST secrets
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
        run: |
          test -n "$BINGX_API_KEY" || (echo "Missing repository secret BINGX_API_KEY" && exit 1)
          test -n "$BINGX_SECRET_KEY" || (echo "Missing repository secret BINGX_SECRET_KEY" && exit 1)
      - name: Run tests
        run: npm test
      - name: Run historical backtest
        env:
          ENGINE: ${{ inputs.engine }}
          SYMBOL: ${{ inputs.symbol }}
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
        run: node scripts/run-bingx-backtest.js
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: bingx-vst-${{ inputs.engine }}-${{ inputs.symbol }}
          path: backtest-report.json
          if-no-files-found: error
          retention-days: 30
