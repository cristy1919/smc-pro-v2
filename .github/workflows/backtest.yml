name: Public-data SMC historical backtest
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: BingX USDT-M symbol
        required: true
        default: BTC-USDT
        type: string
concurrency:
  group: public-smc-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Run 30/60/90-day public-data backtests
        env:
          SYMBOL: ${{ inputs.symbol }}
          FEE_RATE: "0.0005"
          SLIPPAGE_RATE: "0.0002"
        run: node scripts/run-bingx-backtest.js
      - name: Upload detailed report
        uses: actions/upload-artifact@v4
        with:
          name: smc-public-backtest-${{ inputs.symbol }}
          path: backtest-report.json
          if-no-files-found: error
          retention-days: 14
