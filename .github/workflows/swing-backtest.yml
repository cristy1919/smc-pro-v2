name: BingX Swing 50-pair 90-day backtest
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/run-bingx-swing-50x90-backtest.js
      - src/multi-timeframe-backtest.js
concurrency:
  group: bingx-swing-50x90-backtest
  cancel-in-progress: false
jobs:
  swing-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Swing backtest script syntax
        run: node --check scripts/run-bingx-swing-50x90-backtest.js
      - name: Run repository tests
        run: npm test
      - name: Run sequential 3x30-day Swing walk-forward backtest
        env:
          WINDOW_DAYS: "90"
          TARGET_SYMBOLS: "50"
          FEE_RATE: "0.0005"
          SLIPPAGE_RATE: "0.0002"
        run: node scripts/run-bingx-swing-50x90-backtest.js
      - name: Upload detailed Swing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-swing-50-pairs-90-days-walk-forward
          path: swing-50-pairs-90d-walk-forward-report.json
          if-no-files-found: warn
          retention-days: 14
