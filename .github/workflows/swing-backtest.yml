name: BingX all-strategy matrix 50-pair 90-day backtest
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/swing-backtest.yml
      - scripts/run-bingx-strategy-matrix-backtest.js
      - src/multi-timeframe-backtest.js
      - src/backtest-universe.js
      - src/bingx-market-data.js
      - src/setup-evaluator.js
      - src/entry-confirmation.js
      - test/**
concurrency:
  group: bingx-all-strategy-matrix-50x90
  cancel-in-progress: false
jobs:
  strategy-matrix-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate strategy matrix script syntax
        run: node --check scripts/run-bingx-strategy-matrix-backtest.js
      - name: Run repository tests
        run: npm test
      - name: Run independent Scalp and Swing strategy matrix
        env:
          WINDOW_DAYS: "90"
          TARGET_SYMBOLS: "50"
          FEE_RATE: "0.0005"
          SLIPPAGE_RATE: "0.0002"
        run: node scripts/run-bingx-strategy-matrix-backtest.js
      - name: Upload full technical and trade-level report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-all-strategy-matrix-50-pairs-90-days
          path: bingx-strategy-matrix-50-pairs-90d-report.json
          if-no-files-found: warn
          retention-days: 14
