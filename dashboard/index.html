<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMC PRO V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a101c;color:#e7edf7;font:14px system-ui;padding:22px}.wrap{max-width:1300px;margin:auto}.top,.card,.panel{background:#121d2c;border:1px solid #28364b;border-radius:14px;padding:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#91a1b8;font-size:12px}.status{color:#46d7a0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.v{font-size:25px;font-weight:700;margin-top:8px}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button{background:#121d2c;color:#b7c5d8;border:1px solid #28364b;border-radius:8px;padding:10px;white-space:nowrap}.tabs button.active{background:#23416a;color:white}.panel{min-height:300px}.empty{padding:36px;text-align:center;color:#91a1b8;border:1px dashed #394b64;border-radius:10px;margin-top:15px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:11px;border-bottom:1px solid #28364b;font-size:12px}th{color:#91a1b8}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}body{padding:12px}}</style>
<div class="wrap"><header class="top"><div><b style="font-size:20px">SMC PRO <span style="color:#79aaff">V2</span></b><div class="muted">Scalp + Swing · Price Action Futures · BingX VST Demo</div></div><div id="status" class="muted">Worker bağlantısı kontrol ediliyor…</div></header>
<section class="cards"><div class="card"><div class="muted">VST Equity</div><div class="v" id="equity">—</div></div><div class="card"><div class="muted">Açık Pozisyon</div><div class="v" id="positions">—</div></div><div class="card"><div class="muted">Gerçekleşen PnL</div><div class="v" id="pnl">—</div></div><div class="card"><div class="muted">Son Tarama</div><div class="v" id="scan" style="font-size:17px">—</div></div></section>
<nav class="tabs" id="tabs"></nav><section class="panel"><b id="heading">Market Overview</b><div id="body" class="empty">API verisi yükleniyor…</div></section><p class="muted">Salt okunur panel. Emir açma veya kapama komutu göndermez. Canlı işlem modu kapalıdır.</p></div>
<script>
const API="https://smcprov2.smcprov2-stack.workers.dev",T=["Market Overview","Açık İşlemler","Scalp Scanner","Swing Scanner","Positions","Statistics","İşlem Adayları","Trade History","Diagnostics","Grafik"];let h=null,a=null,active=0;const $=x=>document.getElementById(x),pick=(o,k)=>{for(const x of k)if(o&&o[x]!=null)return o[x];return null},fmt=x=>x==null?"—":Number(x).toLocaleString("en-US",{maximumFractionDigits:2});function tabs(){$("tabs").innerHTML=T.map((x,i)=>'<button class="'+(i===active?"active":"")+'" data-i="'+i+'">'+x+'</button>').join("");document.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=+b.dataset.i;tabs();draw()})}function draw(){const p=pick(h,["positions","openPositions","open_positions"])||[],tr=pick(a,["closedTrades","closed_trades","trades"])||[];$("heading").textContent=T[active];let rows=active===1||active===4?p:active===5||active===7?tr:pick(h,["candidates","setups","signals"])||[];if(active===0){$("body").className="";$("body").innerHTML='<div class="empty">BingX VST Demo veri akışı. Scalp ve Swing verileri ilgili sekmelerde listelenir.</div>';return}if(!Array.isArray(rows)||!rows.length){$("body").className="empty";$("body").textContent="Bu bölüm için API tarafından döndürülen kayıt bulunamadı.";return}$("body").className="";$("body").innerHTML='<table><thead><tr><th>Parite</th><th>Motor</th><th>Yön</th><th>Giriş</th><th>Fiyat/Çıkış</th><th>TP</th><th>SL</th><th>PnL/Skor</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+(x.symbol||"—")+'</td><td>'+(x.engine||x.model||"—")+'</td><td>'+(x.side||"—")+'</td><td>'+(x.entry??"—")+'</td><td>'+(x.markPrice??x.exitPrice??"—")+'</td><td>'+(x.takeProfit??x.tp3??"—")+'</td><td>'+(x.stopLoss??"—")+'</td><td>'+(x.pnlUsdt??x.score??"—")+'</td></tr>').join("")+'</tbody></table>'}async function load(){try{let [x,y]=await Promise.all([fetch(API+"/api/demo/health",{cache:"no-store"}),fetch(API+"/api/paper/analytics",{cache:"no-store"})]);if(x.ok)h=await x.json();if(y.ok)a=await y.json();if(!x.ok&&!y.ok)throw Error("API "+x.status+"/"+y.status);$("status").textContent="Worker bağlantısı kuruldu";$("status").className="status";let eq=pick(h,["equity","balance"])??pick(a,["equity","balance"]),ps=pick(h,["positions","openPositions","open_positions"]),ts=pick(h,["lastScanAt","last_scan_at"]),pn=pick(a,["realizedPnl","realized_pnl","totalPnl"]);$("equity").textContent=eq==null?"—":fmt(eq)+" USDT";$("positions").textContent=Array.isArray(ps)?ps.length:(pick(h,["positionCount","openPositionCount"])??"—");$("pnl").textContent=pn==null?"—":fmt(pn)+" USDT";$("scan").textContent=ts?new Date(ts).toLocaleString("tr-TR"):"—";draw()}catch(e){$("status").textContent="API bağlantısı doğrulanamadı";$("status").className="muted";$("body").className="empty";$("body").textContent="Worker API verisi alınamadı: "+e.message}}tabs();load();setInterval(load,30000);
</script></html>
