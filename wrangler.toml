name = "smc-pro-v2"
main = "worker/index.js"
compatibility_date = "2026-11-24"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "SMC_STATE"
id = "REPLACE_WITH_NEW_KV_NAMESPACE_ID"

[vars]
TRADING_MODE = "paper"
LIVE_TRADING_ENABLED = "false"
DEMO_ORDER_EXECUTION_ENABLED = "false"
